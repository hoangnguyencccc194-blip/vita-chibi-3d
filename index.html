<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6e9f2">
<title>Vita · Phòng nặn mặt 3D (MMD)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦚</text></svg>">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="title"><b>Vita</b> <span>· nặn mặt 3D</span></div>
    <div class="acts">
      <button id="btnView" title="Đổi góc nhìn">🧍 Toàn thân</button>
      <button id="btnRand" title="Ngẫu nhiên">🎲</button>
      <button id="btnReset" title="Đặt lại">↺</button>
      <button id="btnShot" title="Lưu ảnh PNG">📷</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="credit">Model © miHoYo · 模型编辑：神帝宇 · phi thương mại</div>
    <div id="hint">Kéo để xoay · chụm 2 ngón để phóng to</div>
    <div id="loading">
      <div id="ldTxt">Đang tải mô hình Vita…</div>
      <div class="pbar"><i id="ldBar"></i></div>
      <div class="small" id="ldSub">Tải trực tiếp từ trang phát hành chính thức trên bilibili (~1–3 MB)</div>
      <label class="pick">Chọn file .zip mô hình<input id="zipPick" type="file" accept=".zip" hidden></label>
    </div>
  </div>
  <section id="panel" class="open">
    <button id="handle"><span class="bar"></span><span id="handleTxt">Thu gọn ▼</span></button>
    <nav id="tabs"></nav>
    <div id="body"></div>
  </section>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
